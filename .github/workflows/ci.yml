name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: php -l (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Lint de todo PHP fora de vendor
        run: |
          find . -name '*.php' \
            -not -path './system/vendor/*' \
            -not -path './tools/*/vendor/*' \
            -print0 | xargs -0 -n1 -P4 php -l > lint.log || { grep -v '^No syntax errors' lint.log; exit 1; }

  unit:
    name: unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
          tools: composer:v2
      - name: Instalar PHPUnit (tools/phpunit)
        run: composer install -d tools/phpunit --no-interaction --no-progress --prefer-dist
      - name: Suíte unit
        run: tools/phpunit/vendor/bin/phpunit --testsuite unit

  integration:
    name: integration (PHP ${{ matrix.php }} / ${{ matrix.db.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
        db:
          - { name: 'MySQL 8.0', image: 'mysql:8.0' }
          - { name: 'MariaDB 10.6', image: 'mariadb:10.6' }
    services:
      db:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gojira_test
          MYSQL_USER: gojira
          MYSQL_PASSWORD: gojira
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      GOJIRA_TEST_DB_HOST: 127.0.0.1
      GOJIRA_TEST_DB_USER: gojira
      GOJIRA_TEST_DB_PASSWORD: gojira
      GOJIRA_TEST_DB_NAME: gojira_test
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
          tools: composer:v2
      - name: Instalar PHPUnit (tools/phpunit)
        run: composer install -d tools/phpunit --no-interaction --no-progress --prefer-dist
      - name: Suíte integration
        run: tools/phpunit/vendor/bin/phpunit --testsuite integration

  demo-smoke:
    name: project_demo (smoke HTTP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Subir o demo (PHP/Apache + MySQL)
        run: docker compose -f project_demo/docker-compose.yml up -d --build

      - name: Esperar a home responder
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || echo 000)
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 3
          done
          echo "Timeout esperando http://localhost:8080/ responder 200"
          docker compose -f project_demo/docker-compose.yml logs
          exit 1

      - name: Página inicial carrega (vhost raiz, DocumentRoot = project_demo)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)
          test "$code" = "200" || { echo "esperado 200, recebido $code"; exit 1; }

      - name: Página inicial carrega sem RewriteBase fixo (vhost subpasta, /project_demo/)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/project_demo/)
          test "$code" = "200" || { echo "esperado 200, recebido $code"; exit 1; }

      - name: Rota de erro dá 404 sanitizado (controller inexistente)
        run: |
          code=$(curl -s -o /tmp/body.html -w '%{http_code}' http://localhost:8080/rota-inexistente-glx42/nada)
          test "$code" = "404" || { echo "esperado 404, recebido $code"; cat /tmp/body.html; exit 1; }
          # Sem caminho de arquivo nem SQL na resposta (nunca <?php, /var/www, informa_schema).
          ! grep -qiE '/var/www|information_schema|<\?php' /tmp/body.html || { echo "corpo do 404 vazou detalhe interno"; cat /tmp/body.html; exit 1; }

      - name: .env continua bloqueado
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/.env)
          test "$code" != "200" || { echo "esperado diferente de 200, recebido $code"; exit 1; }

      - name: system/*.php continua bloqueado
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/system/init.php)
          test "$code" != "200" || { echo "esperado diferente de 200, recebido $code"; exit 1; }

      - name: vendor/ continua bloqueado
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/vendor/autoload.php)
          test "$code" != "200" || { echo "esperado diferente de 200, recebido $code"; exit 1; }

      - name: Logs do demo (sempre, para depuração)
        if: always()
        run: docker compose -f project_demo/docker-compose.yml logs

      - name: Derrubar o demo
        if: always()
        run: docker compose -f project_demo/docker-compose.yml down -v

  phpstan:
    name: phpstan (PHP 8.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli
          coverage: none
          tools: composer:v2
      - name: Instalar PHPStan (tools/phpstan)
        run: composer install -d tools/phpstan --no-interaction --no-progress --prefer-dist
      - name: Instalar PHPUnit (tools/phpunit, usado pela análise dos testes)
        run: composer install -d tools/phpunit --no-interaction --no-progress --prefer-dist
      - name: Análise estática (nível 1, com baseline)
        run: tools/phpstan/vendor/bin/phpstan analyse -c tools/phpstan/phpstan.neon.dist --no-progress
