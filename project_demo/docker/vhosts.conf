# Dois vhosts para provar que o .htaccess do project_demo funciona sem
# RewriteBase fixo nas duas topologias de deploy:
#   :80   DocumentRoot = project_demo        ("raiz": domínio próprio)
#   :8080 DocumentRoot = raiz do repositório  ("subpasta": /project_demo/)

Listen 8080

<VirtualHost *:80>
   DocumentRoot /var/www/html/project_demo

   <Directory /var/www/html/project_demo>
      AllowOverride All
      Require all granted
      Options -Indexes +FollowSymLinks
   </Directory>
</VirtualHost>

<VirtualHost *:8080>
   DocumentRoot /var/www/html

   <Directory /var/www/html>
      AllowOverride All
      Require all granted
      Options -Indexes +FollowSymLinks
   </Directory>
</VirtualHost>
